name: Pull request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    uses: ./.github/workflows/check.yml

  preview:
    needs: check
    runs-on: ubuntu-latest
    # Forks cannot read the service-account secret, so the preview deploy is skipped
    # for them rather than failing the whole run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_REACT_BURGERBUILDER_APP }}
          projectId: my-react-burgerbuilder-app
          channelId: pr-${{ github.event.number }}
          expires: 7d
